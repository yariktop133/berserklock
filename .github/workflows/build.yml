name: Build BerserkLock

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: beerpiss/theos-action@v1

      - name: Build Rootless .deb Package
        run: |
          if [ -d layout/DEBIAN ]; then
            chmod -R 0755 layout/DEBIAN
            for f in layout/DEBIAN/*; do
              [ -f "$f" ] && tr -d '\r' < "$f" > "$f.tmp" && mv "$f.tmp" "$f" && chmod 0755 "$f"
            done
          fi
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Upload .deb Package for Sileo
        uses: actions/upload-artifact@v4
        with:
          name: BerserkLock-iOS15-Rootless
          path: packages/*.deb
